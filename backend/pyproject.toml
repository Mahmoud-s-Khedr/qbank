[project]
name = "qbank"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "sqlalchemy>=2",
    "psycopg[binary]>=3",
    "alembic",
    "structlog",
    "uuid-utils",
    "argon2-cffi>=25.1.0",
    "pyjwt>=2.15.1",
    "pymupdf<2",
    "boto3>=1.43.123",
    "dramatiq[redis]>=2.2.1",
    "pillow>=13.0.0",
    "python-multipart>=0.0.32",
    "openai>=1,<3",
    "jinja2>=3.1.6",
    "opencv-python-headless>=5.0.0.93",
]

[project.scripts]
qbank-eval = "qbank.eval.cli:main"

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-cov",
    "httpx",
    "boto3-stubs[s3]>=1.43.123",
    "hypothesis>=6.170.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E","W","F","I","B","UP","SIM","RUF","S","N","PT","C4","DTZ","T20","ASYNC","PL","PERF"]
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"src/qbank/llm/errors.py" = ["N818"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires PostgreSQL"]
addopts = "--cov=qbank --cov-report=term-missing --cov-report=xml"
# Starlette deprecates its httpx TestClient integration; changing dependencies is out of scope.
filterwarnings = [
    "error",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated.*:starlette.exceptions.StarletteDeprecationWarning",
]
[tool.coverage.report]
fail_under = 80
