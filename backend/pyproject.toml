[project]
name = "qbank"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi", "uvicorn[standard]", "pydantic", "pydantic-settings", "sqlalchemy>=2", "psycopg[binary]>=3", "alembic", "structlog", "uuid-utils"]

[dependency-groups]
dev = ["ruff", "mypy", "pytest", "pytest-cov", "httpx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E","W","F","I","B","UP","SIM","RUF","S","N","PT","C4","DTZ","T20","ASYNC","PL","PERF"]
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires PostgreSQL"]
addopts = "--cov=qbank --cov-report=term-missing"
[tool.coverage.report]
fail_under = 80
