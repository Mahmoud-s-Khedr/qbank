version: 2
updates:
  - package-ecosystem: uv
    cooldown: {default-days: 3}  # skip releases younger than 3 days (supply-chain safety)
    directory: /backend
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
    commit-message: {prefix: "chore(deps)"}
    groups:
      minor-patch: {update-types: [minor, patch]}
  - package-ecosystem: npm
    cooldown: {default-days: 3}  # skip releases younger than 3 days (supply-chain safety)
    directory: /frontend
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
    commit-message: {prefix: "chore(deps)"}
    groups:
      minor-patch: {update-types: [minor, patch]}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
    commit-message: {prefix: "chore(ci)"}
    groups:
      minor-patch: {update-types: [minor, patch]}
  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
    commit-message: {prefix: "chore(deps)"}
    groups:
      minor-patch: {update-types: [minor, patch]}
    ignore:
      # Stay on the LTS / project-pinned runtimes; bump these deliberately.
      - dependency-name: node
        update-types: [version-update:semver-major]
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: astral-sh/uv
        update-types: [version-update:semver-major]
