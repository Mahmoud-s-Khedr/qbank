repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
        exclude: ^fixtures/
      - id: mixed-line-ending
        args: [--fix=lf]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        language: system
        entry: >-
          bash -c 'files=(); for f in "$@"; do files+=("${f#frontend/}"); done; pnpm -C frontend exec prettier --write --ignore-unknown "${files[@]}"' --
        files: ^frontend/.*\.(js|mjs|cjs|jsx|ts|tsx|json|css|html|md|yaml|yml)$
        exclude: ^frontend/(src/api/schema\.d\.ts|pnpm-lock\.yaml)$
      - id: eslint
        name: eslint
        language: system
        entry: >-
          bash -c 'files=(); for f in "$@"; do files+=("${f#frontend/}"); done; pnpm -C frontend exec eslint --max-warnings 0 --no-warn-ignored "${files[@]}"' --
        files: ^frontend/.*\.(js|mjs|cjs|jsx|ts|tsx)$
        exclude: ^frontend/src/api/schema\.d\.ts$
      - id: mypy
        name: mypy
        language: system
        entry: uv run --directory backend mypy
        pass_filenames: false
        stages: [pre-push]
        always_run: true
